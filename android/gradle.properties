org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
# Work around a JDK TLS handshake failure against dl.google.com in some CI
# sandboxes; harmless elsewhere.
# android.newDsl=false is required when running with AGP 9.0+ because Flutter Gradle Plugin
# in Flutter stable casts extensions.findByName("android") to AbstractAppExtension (Flutter issue #166550).
# android.builtInKotlin=false has been safely removed as all plugins now support built-in Kotlin.
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
