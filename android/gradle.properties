org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
# Network resilience for artifact downloads on unstable or mobile connections
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.max.tentatives=10
# Work around a JDK TLS handshake failure against dl.google.com in some CI
# sandboxes; harmless elsewhere.
# android.newDsl=false is required when running with AGP 9.0+ because Flutter Gradle Plugin
# in Flutter stable casts extensions.findByName("android") to AbstractAppExtension (Flutter issue #166550).
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
