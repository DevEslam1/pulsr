<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BotGuard Helper</title>
  <script>
/**
 * Factory method to create and load a BotGuardClient instance.
 * @param {Object} challengeData - Configuration options for the BotGuardClient.
 * @returns {Promise<Object>} A promise that resolves to a loaded BotGuardClient instance.
 */
function loadBotGuard(challengeData) {
  const globalScope = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  const vm = globalScope[challengeData.globalName];
  const program = challengeData.program;

  if (!vm) {
    return Promise.reject(new Error('[BotGuardClient]: VM not found in the global object'));
  }

  if (typeof vm.a !== 'function') {
    return Promise.reject(new Error('[BotGuardClient]: Could not load program (vm.a is not a function)'));
  }

  let vmFunctions = {};

  const vmFunctionsCallback = function(
    asyncSnapshotFunction,
    shutdownFunction,
    passEventFunction,
    checkCameraFunction
  ) {
    vmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  try {
    vm.a(program, vmFunctionsCallback, true, challengeData.userInteractionElement || null, function() { /* no-op */ }, [ [], [] ]);
  } catch (err) {
    return Promise.reject(new Error('[BotGuardClient]: vm.a execution failed: ' + (err && err.message ? err.message : err)));
  }

  return new Promise(function(resolve, reject) {
    let elapsedMs = 0;
    const intervalMs = 5;
    const timeoutMs = 10000;

    if (window._botGuardIntervalId) {
      clearInterval(window._botGuardIntervalId);
      window._botGuardIntervalId = null;
    }

    window._botGuardIntervalId = setInterval(function() {
      if (typeof vmFunctions.asyncSnapshotFunction === 'function') {
        if (window._botGuardIntervalId) {
          clearInterval(window._botGuardIntervalId);
          window._botGuardIntervalId = null;
        }
        resolve({
          snapshot: function(args) {
            return new Promise(function(snapResolve, snapReject) {
              if (typeof vmFunctions.asyncSnapshotFunction !== 'function') {
                return snapReject(new Error('[BotGuardClient]: Async snapshot function not found'));
              }
              try {
                vmFunctions.asyncSnapshotFunction(function(response) {
                  snapResolve(response);
                }, [
                  args.contentBinding,
                  args.signedTimestamp,
                  args.webPoSignalOutput,
                  args.skipPrivacyBuffer
                ]);
              } catch (snapErr) {
                snapReject(new Error('[BotGuardClient]: Snapshot invocation error: ' + (snapErr && snapErr.message ? snapErr.message : snapErr)));
              }
            });
          }
        });
        return;
      }

      elapsedMs += intervalMs;
      if (elapsedMs >= timeoutMs) {
        if (window._botGuardIntervalId) {
          clearInterval(window._botGuardIntervalId);
          window._botGuardIntervalId = null;
        }
        reject(new Error('[BotGuardClient]: asyncSnapshotFunction is null after ' + (timeoutMs / 1000) + ' seconds timeout'));
      }
    }, intervalMs);
  });
}

window.disposeBotGuard = function() {
  if (window._botGuardIntervalId) {
    clearInterval(window._botGuardIntervalId);
    window._botGuardIntervalId = null;
  }
};

function runBotGuard(challengeData) {
  if (!challengeData || !challengeData.interpreterJavascript) {
    return Promise.reject(new Error('[BotGuardClient]: Invalid challengeData'));
  }

  const interpreterJavascript = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
  if (interpreterJavascript) {
    try {
      new Function(interpreterJavascript)();
    } catch (evalErr) {
      return Promise.reject(new Error('[BotGuardClient]: Failed to execute interpreter script: ' + (evalErr && evalErr.message ? evalErr.message : evalErr)));
    }
  } else {
    return Promise.reject(new Error('[BotGuardClient]: Could not load VM (interpreter script missing)'));
  }

  const webPoSignalOutput = [];
  return loadBotGuard({
    globalName: challengeData.globalName,
    program: challengeData.program
  }).then(function(botguard) {
    return botguard.snapshot({ webPoSignalOutput: webPoSignalOutput });
  }).then(function(botguardResponse) {
    return { webPoSignalOutput: webPoSignalOutput, botguardResponse: botguardResponse };
  });
}

function obtainPoToken(webPoSignalOutput, integrityToken, identifier) {
  if (!Array.isArray(webPoSignalOutput) || webPoSignalOutput.length === 0) {
    throw new Error('PMD:Undefined');
  }

  const getMinter = webPoSignalOutput[0];
  if (typeof getMinter !== 'function') {
    throw new Error('PMD:Undefined');
  }

  const mintCallback = getMinter(integrityToken);
  if (typeof mintCallback !== 'function') {
    throw new Error('APF:Failed');
  }

  const result = mintCallback(identifier);
  if (!result) {
    throw new Error('YNJ:Undefined');
  }

  if (!(result instanceof Uint8Array)) {
    throw new Error('ODM:Invalid');
  }

  return result;
}
  </script>
</head>
<body></body>
</html>
