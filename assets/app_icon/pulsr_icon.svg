<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Perfectly centered gradient so it looks balanced in a circular crop -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="35%" stop-color="#0077ff"/>
      <stop offset="75%" stop-color="#002288"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>

    <!-- Multi-layered glow filter for the neon effect -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- The silhouette of the musical note, perfectly scaled for the safe zone -->
    <path id="notePath" d="M 270,120 
             C 320,100 370,130 380,165 
             C 385,185 365,190 350,175 
             C 335,155 310,145 295,150 
             L 295,315 
             C 310,290 280,265 240,260 
             C 170,250 120,310 140,370 
             C 160,430 240,430 280,380 
             C 295,360 295,340 295,320 
             L 295,120 Z" />

    <!-- Clip path to keep the mesh strictly inside the note -->
    <clipPath id="noteClip">
      <use href="#notePath" />
    </clipPath>
  </defs>

  <!-- Base Shape: By default a rounded square, but completely fills the 512x512 canvas if you change rx="0" for standard app icon generators -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Background Ambient Waves -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5">
    
    <!-- Central, balanced waves that frame a circular crop perfectly -->
    <g opacity="0.08">
      <circle cx="256" cy="256" r="140" />
      <circle cx="256" cy="256" r="180" />
      <circle cx="256" cy="256" r="220" />
      <circle cx="256" cy="256" r="260" />
      <circle cx="256" cy="256" r="300" />
    </g>

    <!-- Bottom Bulb Waves -->
    <g opacity="0.12">
      <circle cx="210" cy="370" r="60" />
      <circle cx="210" cy="370" r="90" />
      <circle cx="210" cy="370" r="120" />
      <circle cx="210" cy="370" r="150" />
      <circle cx="210" cy="370" r="180" />
      <circle cx="210" cy="370" r="210" />
      <circle cx="210" cy="370" r="240" />
      <circle cx="210" cy="370" r="270" opacity="0.5"/>
      <circle cx="210" cy="370" r="300" opacity="0.3"/>
      <circle cx="210" cy="370" r="330" opacity="0.1"/>
    </g>
    
    <!-- Top Hook Waves -->
    <g opacity="0.12">
      <circle cx="340" cy="165" r="50" />
      <circle cx="340" cy="165" r="80" />
      <circle cx="340" cy="165" r="110" />
      <circle cx="340" cy="165" r="140" />
      <circle cx="340" cy="165" r="170" />
      <circle cx="340" cy="165" r="200" />
      <circle cx="340" cy="165" r="230" opacity="0.5"/>
    </g>
  </g>

  <!-- Glowing Note with Internal Mesh -->
  <g filter="url(#neonGlow)">
    
    <!-- Solid white background for the note to give it base brightness -->
    <use href="#notePath" fill="#ffffff" opacity="0.15" />
    
    <!-- Concentric mesh restricted to the inside of the note -->
    <g clip-path="url(#noteClip)" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9">
      <!-- Mesh emanating from the bottom bulb -->
      <circle cx="210" cy="370" r="5" />
      <circle cx="210" cy="370" r="12" />
      <circle cx="210" cy="370" r="19" />
      <circle cx="210" cy="370" r="26" />
      <circle cx="210" cy="370" r="33" />
      <circle cx="210" cy="370" r="40" />
      <circle cx="210" cy="370" r="47" />
      <circle cx="210" cy="370" r="54" />
      <circle cx="210" cy="370" r="61" />
      <circle cx="210" cy="370" r="68" />
      <circle cx="210" cy="370" r="75" />
      <circle cx="210" cy="370" r="82" />
      <circle cx="210" cy="370" r="89" />
      <circle cx="210" cy="370" r="96" />
      <circle cx="210" cy="370" r="103" />
      <circle cx="210" cy="370" r="110" />
      <circle cx="210" cy="370" r="117" />
      <circle cx="210" cy="370" r="124" />
      <circle cx="210" cy="370" r="131" />
      <circle cx="210" cy="370" r="138" />
      <circle cx="210" cy="370" r="145" />
      <circle cx="210" cy="370" r="152" />
      
      <!-- Mesh emanating from the top hook -->
      <circle cx="340" cy="165" r="5" />
      <circle cx="340" cy="165" r="12" />
      <circle cx="340" cy="165" r="19" />
      <circle cx="340" cy="165" r="26" />
      <circle cx="340" cy="165" r="33" />
      <circle cx="340" cy="165" r="40" />
      <circle cx="340" cy="165" r="47" />
      <circle cx="340" cy="165" r="54" />
      <circle cx="340" cy="165" r="61" />
      <circle cx="340" cy="165" r="68" />
      <circle cx="340" cy="165" r="75" />
      <circle cx="340" cy="165" r="82" />
    </g>

    <!-- Thick bright outline for the main shape -->
    <use href="#notePath" fill="none" stroke="#ffffff" stroke-width="4" />
  </g>
  
  <!-- Outer sharp outline to define the crisp edge -->
  <use href="#notePath" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
</svg>
