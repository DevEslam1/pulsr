plugins {
    id 'com.android.library'
}

group 'es.antonborri.home_widget'
version '1.0-SNAPSHOT'

android {
    namespace 'es.antonborri.home_widget'
    compileSdk 37

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    api 'androidx.glance:glance-appwidget:1.2.0'
    // TypedValueCompat.spToPx, which follows the non-linear font scaling of
    // Android 14 and newer the way a TextView does.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
