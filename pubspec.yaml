name: pulsr
description: "Pulsr Music - Premium offline-first local music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  just_audio: ^0.10.6
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  mutex: ^3.1.0
  on_audio_query: ^2.9.0
  drift: ^2.26.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  palette_generator: ^0.3.3+6
  dynamic_color: ^2.1.0
  flutter_animate: ^4.5.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.2
  fpdart: ^1.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  file_picker: ^12.2.0
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  home_widget: ^0.9.4
  sentry_flutter: ^8.14.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  flutter_inappwebview: ^6.1.5
  crypto: ^3.0.6
  http: ^1.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  rxdart: ^0.28.0
  clock: ^1.1.2
  connectivity_plus: ^6.1.4

# Vendored fork: adds NativeDspAudioProcessor to the ExoPlayer audio sink so
# libpulsr_dsp receives the decoded PCM stream. Nothing else is changed.
dependency_overrides:
  just_audio:
    path: third_party/just_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  injectable_generator: ^3.1.3
  freezed: ^4.0.1
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_icon/
    - assets/eq_profiles/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon_plus.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0C12"
  adaptive_icon_foreground: "assets/app_icon/app_icon_plus.png"
  web:
    generate: true
    image_path: "assets/app_icon/app_icon_plus.png"
  windows:
    generate: true
    image_path: "assets/app_icon/app_icon_plus.png"


