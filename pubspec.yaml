name: pulsr
description: "Pulsr Music - Premium offline-first local music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^14.8.1
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  on_audio_query: ^2.9.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.28
  palette_generator: ^0.3.3+6
  flutter_animate: ^4.5.2
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
