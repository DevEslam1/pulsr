name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android Release
    needs: analyze-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create Mock Keystore for CI Build
        run: |
          mkdir -p android/keystores
          keytool -genkey -v -keystore android/keystores/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pulsr_release -dname "CN=Pulsr, OU=Mobile, O=Pulsr, L=City, S=State, C=US" -storepass pulsrci123 -keypass pulsrci123
          echo "storeFile=../keystores/release.jks" > android/key.properties
          echo "storePassword=pulsrci123" >> android/key.properties
          echo "keyAlias=pulsr_release" >> android/key.properties
          echo "keyPassword=pulsrci123" >> android/key.properties

      - name: Build Android App Bundle
        run: flutter build appbundle --flavor prod --release --obfuscate --split-debug-info=symbols --dart-define=ENV=prod --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Upload Release AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-release
          path: build/app/outputs/bundle/*Release/*.aab
          if-no-files-found: warn

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: symbols/
          if-no-files-found: ignore
